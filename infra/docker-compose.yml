services:
  postgres:
    image: docker.io/postgres:16
    container_name: raph-meris-postgres
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-raph_meris}
      POSTGRES_USER: ${POSTGRES_USER:-raph_meris}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-raph_meris} -d ${POSTGRES_DB:-raph_meris}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

